name: Update Streak Stats

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # Runs 4 times a day (every 6 hours)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/streak-stats.svg'

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Update streak stats SVG
        run: python scripts/update-streak.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          if git diff --staged --quiet; then
            echo "No changes in streak stats."
          else
            git commit -m "chore(streak): auto-update streak stats [skip ci]"
            git push
          fi
