<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Charcoal Dot-Matrix Grid -->
    <pattern id="dot-grid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#1C1C22" />
    </pattern>
  </defs>

  <style>
    .mono-bold { font-family: 'Space Mono', 'SF Mono', 'Courier New', monospace; font-weight: 700; }
    .mono { font-family: 'Space Mono', 'SF Mono', 'Courier New', monospace; font-weight: 400; }
    
    @keyframes line1Reveal {
      0%, 4% { opacity: 0; }
      10%, 92% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes line2Reveal {
      0%, 25% { opacity: 0; }
      32%, 92% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes line3Reveal {
      0%, 50% { opacity: 0; }
      58%, 92% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes progressAnim {
      0% { width: 30px; }
      30% { width: 180px; }
      60% { width: 360px; }
      85%, 92% { width: 520px; }
      98%, 100% { width: 10px; }
    }
    @keyframes blinkLedPattern {
      /* 2 times fast */
      0% { opacity: 0.25; filter: none; }
      4%, 10% { opacity: 1; filter: drop-shadow(0 0 5px #E02424); }
      14% { opacity: 0.25; filter: none; }
      18%, 24% { opacity: 1; filter: drop-shadow(0 0 5px #E02424); }
      28% { opacity: 0.25; filter: none; }
      /* 2 times slower */
      38% { opacity: 0.25; filter: none; }
      46%, 60% { opacity: 1; filter: drop-shadow(0 0 5px #E02424); }
      68% { opacity: 0.25; filter: none; }
      76%, 90% { opacity: 1; filter: drop-shadow(0 0 5px #E02424); }
      98%, 100% { opacity: 0.25; filter: none; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .line1 { animation: line1Reveal 8s infinite ease-out; }
    .line2 { animation: line2Reveal 8s infinite ease-out; }
    .line3 { animation: line3Reveal 8s infinite ease-out; }
    .bar-fill { animation: progressAnim 8s infinite cubic-bezier(0.2, 0.8, 0.2, 1); }
    .led-pattern { animation: blinkLedPattern 3.6s infinite ease-in-out; }
    .cursor { animation: blinkCursor 0.8s infinite; }
  </style>

  <!-- Shell background & border (Charcoal #0D0D0D + #222222) -->
  <rect x="1" y="1" width="798" height="258" rx="14" fill="#0D0D0D" stroke="#222222" stroke-width="1.2" />
  <rect x="2" y="2" width="796" height="256" rx="13" fill="url(#dot-grid)" />

  <!-- Top bar (Dev Instance indicator & location) -->
  <rect x="30" y="25" width="10" height="10" rx="2" fill="#E02424" class="led-pattern" />
  <text x="48" y="34" class="mono" font-size="11" fill="#71717A" letter-spacing="1">DEV_INSTANCE</text>
  <text x="766" y="34" class="mono" font-size="11" fill="#71717A" text-anchor="end" letter-spacing="0.5">DHAKA, BANGLADESH</text>

  <line x1="16" y1="48" x2="784" y2="48" stroke="#1F1F24" stroke-width="1" />

  <!-- Username heading -->
  <g transform="translate(32, 82)">
    <text x="0" y="0" class="mono-bold" font-size="22" fill="#FFFFFF" letter-spacing="-0.5">mahirstillbooting</text>
    <rect x="238" y="-16" width="120" height="22" rx="4" fill="#18181B" stroke="#222222" stroke-width="1" />
    <text x="246" y="-1" class="mono" font-size="10" fill="#A1A1AA" letter-spacing="0.8">BUILD v0.1.0</text>
  </g>

  <!-- Boot sequence on 3 distinct, non-overlapping rows -->
  <!-- Row 1: Y = 114 -->
  <g class="line1" transform="translate(32, 114)">
    <text x="0" y="0" class="mono" font-size="12" fill="#71717A">[0.12s]</text>
    <text x="64" y="0" class="mono" font-size="12" fill="#E4E4E7">INITIALIZING DEVELOPER INSTANCE...</text>
    <text x="440" y="0" class="mono-bold" font-size="11" fill="#FFFFFF">[OK]</text>
  </g>

  <!-- Row 2: Y = 142 -->
  <g class="line2" transform="translate(32, 142)">
    <text x="0" y="0" class="mono" font-size="12" fill="#71717A">[0.48s]</text>
    <text x="64" y="0" class="mono" font-size="12" fill="#E4E4E7">LOADING CURIOSITY..................</text>
    <text x="440" y="0" class="mono-bold" font-size="11" fill="#E02424">[100%]</text>
  </g>

  <!-- Row 3: Y = 170 -->
  <g class="line3" transform="translate(32, 170)">
    <text x="0" y="0" class="mono" font-size="12" fill="#71717A">[0.92s]</text>
    <text x="64" y="0" class="mono-bold" font-size="12" fill="#FFFFFF">STATUS ONLINE - RUNTIME READY</text>
    <text x="440" y="0" class="mono-bold" font-size="11" fill="#E02424">[ACTIVE]</text>
    <text x="510" y="0" class="mono cursor" font-size="12" fill="#E02424">█</text>
  </g>

  <!-- Progress bar frame at bottom: Y = 216 -->
  <g transform="translate(32, 216)">
    <text x="0" y="10" class="mono" font-size="10" fill="#71717A" letter-spacing="1">BOOT PROGRESS</text>
    <!-- Background track -->
    <rect x="120" y="1" width="520" height="10" rx="3" fill="#141418" stroke="#222222" stroke-width="1" />
    <!-- Animated Fill Bar -->
    <rect x="121" y="2" width="30" height="8" rx="2" fill="#FFFFFF" class="bar-fill" />
    <!-- Crimson Red Accent trailing pixel -->
    <rect x="650" y="1" width="10" height="10" rx="2" fill="#E02424" class="led-pattern" />
    <text x="672" y="10" class="mono" font-size="10" fill="#A1A1AA">STILL BOOTING</text>
  </g>
</svg>
