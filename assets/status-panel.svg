<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="100%" height="170" fill="none">
  <defs>
    <pattern id="status-grid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1C1C22" />
    </pattern>
  </defs>

  <style>
    .mono-bold { font-family: 'Space Mono', 'SF Mono', 'Courier New', monospace; font-weight: 700; }
    .mono { font-family: 'Space Mono', 'SF Mono', 'Courier New', monospace; font-weight: 400; }
    
    @keyframes pulseLed {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #D71921); }
      50% { opacity: 0.3; filter: none; }
    }
    @keyframes pulseSignal {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .led-red { animation: pulseLed 1.8s infinite ease-in-out; }
    .sig1 { animation: pulseSignal 1.2s infinite ease-in-out; }
    .sig2 { animation: pulseSignal 1.2s infinite ease-in-out 0.3s; }
    .sig3 { animation: pulseSignal 1.2s infinite ease-in-out 0.6s; }
    .cursor { animation: cursorBlink 0.9s infinite; }
  </style>

  <!-- Shell background & border -->
  <rect x="1" y="1" width="798" height="168" rx="12" fill="#0C0C0E" stroke="#222228" stroke-width="1.2" />
  <rect x="2" y="2" width="796" height="166" rx="11" fill="url(#status-grid)" />

  <!-- Top bar -->
  <circle cx="30" cy="24" r="3.5" fill="#D71921" class="led-red" />
  <text x="44" y="28" class="mono" font-size="10.5" fill="#71717A" letter-spacing="1">SYS.TELEMETRY // NOTHING (R) CORE</text>
  <text x="770" y="28" class="mono" font-size="10" fill="#52525B" text-anchor="end" letter-spacing="0.8">CHANNEL: ACTIVE</text>
  <line x1="16" y1="40" x2="784" y2="40" stroke="#1C1C22" stroke-width="1" />

  <!-- Grid of Status Telemetry -->
  <g transform="translate(32, 68)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="mono" font-size="11" fill="#71717A">STATUS</text>
      <text x="80" y="0" class="mono" font-size="11" fill="#52525B">:</text>
      <text x="100" y="0" class="mono-bold" font-size="11" fill="#FFFFFF">LEARNING</text>
      <circle cx="178" cy="-3.5" r="3" fill="#D71921" class="led-red" />
    </g>

    <g transform="translate(0, 26)">
      <text x="0" y="0" class="mono" font-size="11" fill="#71717A">MODE</text>
      <text x="80" y="0" class="mono" font-size="11" fill="#52525B">:</text>
      <text x="100" y="0" class="mono-bold" font-size="11" fill="#E4E4E7">BUILDING</text>
      <rect x="176" y="-7" width="6" height="6" rx="1" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Column 2 -->
    <g transform="translate(360, 0)">
      <text x="0" y="0" class="mono" font-size="11" fill="#71717A">CURIOSITY</text>
      <text x="96" y="0" class="mono" font-size="11" fill="#52525B">:</text>
      <text x="116" y="0" class="mono-bold" font-size="11" fill="#22C55E">ALWAYS ON</text>
      <!-- Mini signal bars -->
      <g transform="translate(210, -8)">
        <rect x="0" y="6" width="3" height="4" fill="#22C55E" class="sig1" />
        <rect x="5" y="3" width="3" height="7" fill="#22C55E" class="sig2" />
        <rect x="10" y="0" width="3" height="10" fill="#22C55E" class="sig3" />
      </g>
    </g>

    <g transform="translate(360, 26)">
      <text x="0" y="0" class="mono" font-size="11" fill="#71717A">VERSION</text>
      <text x="96" y="0" class="mono" font-size="11" fill="#52525B">:</text>
      <text x="116" y="0" class="mono" font-size="11" fill="#A1A1AA">0.1.0</text>
      <text x="160" y="0" class="mono cursor" font-size="11" fill="#D71921">_</text>
    </g>
  </g>

  <!-- Bottom ticker -->
  <line x1="16" y1="126" x2="784" y2="126" stroke="#1C1C22" stroke-width="1" />
  <g transform="translate(32, 148)">
    <text x="0" y="0" class="mono-bold" font-size="11" fill="#E4E4E7" letter-spacing="2">NOT FINISHED. NOT STANDING STILL.</text>
    <text x="736" y="0" class="mono" font-size="10" fill="#52525B" text-anchor="end">// 2026.SYS</text>
  </g>
</svg>
